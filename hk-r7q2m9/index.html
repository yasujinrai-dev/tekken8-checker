<style>
/* 漆の黒・朱・藍・金。画面はドット絵、文字は等幅のドット書体。配置は縦持ちで上に画面、下に操作盤 */
:root{
  --urushi:#0e0c12; --sumi:#07060b; --shu:#c7412c; --ai:#2c3a6e; --kin:#c9a24e; --washi:#f0e8d6;
  --win:rgba(12,11,25,.95); --line:#ece3cf;
  --ui:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  --logo:'Yuji Syuku','Hiragino Mincho ProN','Noto Serif JP',serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--urushi);color:var(--washi);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:radial-gradient(130% 70% at 50% 0%,#1f1a2a 0%,var(--urushi) 62%)}
#screen{position:fixed;background:#000;box-shadow:0 0 0 2px #000,0 0 0 3px var(--kin),0 10px 34px rgba(0,0,0,.65)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;left:0;top:0;width:240rem;height:240rem;pointer-events:none;overflow:hidden;font-family:var(--ui)}
.catcher{position:absolute;inset:0;pointer-events:auto;display:none}
.w{position:absolute;pointer-events:auto;box-sizing:border-box;background:var(--win);color:#f3ecdc;border:1.6rem solid var(--line);border-radius:4rem;
  box-shadow:0 0 0 1rem #050409,inset 0 0 0 1rem #2b2542;font-size:10rem;line-height:15rem;padding:5rem 8rem;letter-spacing:.25rem}
.info{pointer-events:none}
.msg{left:6rem;right:6rem;bottom:6rem;min-height:57rem;display:none;white-space:pre-wrap;line-break:strict}
.msg.center{left:10rem;right:10rem;text-align:center}
.msg .tab{position:absolute;left:8rem;top:-10rem;background:var(--line);color:#1a1530;font-size:8rem;line-height:10rem;padding:1rem 6rem;border-radius:3rem;letter-spacing:.5rem}
ruby{ruby-position:over;ruby-align:center}rt{font-size:4.6rem;line-height:1;letter-spacing:0;font-weight:normal;opacity:.85}
.msg .tab rt{font-size:4rem}
.msg .more{position:absolute;right:7rem;bottom:1rem;font-size:7rem;line-height:9rem;animation:blink .9s steps(2) infinite}
.list .ttl{color:var(--kin);font-size:9rem;line-height:12rem;margin:0 0 2rem;padding-bottom:1rem;border-bottom:1rem solid rgba(236,227,207,.22);white-space:nowrap}
.items{display:grid;column-gap:4rem}
.opt{position:relative;display:flex;justify-content:space-between;gap:8rem;padding:0 2rem 0 11rem;line-height:16rem;white-space:nowrap;cursor:pointer}
.opt .r{color:#d6ccb4}
.opt.dis{color:#6f6a80}.opt.dis .r{color:#6f6a80}
.opt.sel::before{content:'';position:absolute;left:1rem;top:4rem;border-left:6rem solid #f3ecdc;border-top:4rem solid transparent;border-bottom:4rem solid transparent;animation:blink .8s steps(2) infinite}
.scr{position:absolute;right:3rem;font-size:7rem;line-height:8rem;padding:0 4rem;cursor:pointer;color:var(--kin)}
.scr.up{top:1rem}.scr.dn{bottom:0}
.empty{color:#9c96ad;padding-left:4rem}
.banner{position:absolute;left:50%;top:10rem;transform:translateX(-50%);opacity:0;background:rgba(7,6,11,.72);border:1rem solid var(--kin);color:var(--washi);
  font-size:10rem;line-height:15rem;padding:2rem 10rem;border-radius:2rem;letter-spacing:2rem;white-space:nowrap;transition:opacity .2s}
.party{font-size:9.5rem;line-height:13rem}
.party .pm{display:grid;grid-template-columns:1fr auto;column-gap:6rem;padding:1rem 0 3rem;border-bottom:1rem dashed rgba(236,227,207,.16)}
.party .pm:last-child{border-bottom:0;padding-bottom:0}
.party .n{color:var(--kin)} .party .pm.dead,.party .pm.dead .n{color:#857f93}
.gold{text-align:right;color:var(--kin)}
.desc{font-size:9rem;line-height:13rem;white-space:pre-wrap;min-height:34rem}
.status{font-size:10rem;line-height:16.5rem}
.status .srow{display:flex;justify-content:space-between;gap:10rem;border-bottom:1rem dotted rgba(236,227,207,.14)}
.status .srow:first-child{color:var(--kin)}
.status .k{color:#b9b0c9;white-space:nowrap}.status .v{text-align:right}
.beads{text-align:center}
.beads .bt{color:var(--kin);font-size:11rem;letter-spacing:2rem}
.beads .bar{display:flex;gap:2rem;margin:5rem 8rem}.beads .bar span{flex:1;height:5rem;background:#2b2542;border-radius:1rem}.beads .bar span.on{background:var(--kin)}
.beads .bg{display:grid;grid-template-columns:repeat(4,1fr);gap:4rem 2rem;margin-top:8rem}
.beads .orb{width:26rem;height:26rem;line-height:26rem;margin:0 auto;border-radius:50%;font-size:13rem;background:#1c1830;color:#4f4866;border:1rem solid #3a3352}
.beads .lit .orb{background:radial-gradient(circle at 35% 30%,#fff 0,#f3e2a6 25%,#c9a24e 70%,#7a5d22 100%);color:#3a2a0a;border-color:#f3e2a6;box-shadow:0 0 8rem rgba(243,226,166,.6)}
.beads .who{font-size:7.5rem;line-height:11rem;margin-top:2rem;color:#9c96ad;white-space:nowrap}.beads .lit .who{color:var(--washi)}
.beads .bn{margin-top:10rem;font-size:9rem;color:#d6ccb4}
.bstat{display:flex;gap:3rem;padding:3rem 4rem}
.bstat .bm{flex:1;min-width:0;padding:1rem 3rem;border-radius:2rem;font-size:9.5rem;line-height:13rem;white-space:pre}
.bstat .bm .n{color:var(--kin)}
.bstat .bm.act{background:rgba(201,162,78,.2)}
.bstat .bm.low .v:nth-child(2){color:#ffb15c}
.bstat .bm.dead,.bstat .bm.dead .n{color:#776f86}
.bstat .bm.hit{animation:hit .12s steps(2) 3}
.blog,.elist{white-space:pre-wrap}
.bcmd .ttl{color:var(--kin)}
.tmenu{background:rgba(12,11,25,.86)}
.title{position:absolute;inset:0;text-align:center;pointer-events:none}
.title .logo{font-family:var(--logo);font-size:27rem;line-height:34rem;margin-top:30rem;color:#f7eed6;letter-spacing:1.5rem;
  text-shadow:0 0 7rem rgba(255,186,110,.6),0 2rem 0 #000}
.title .sub{margin-top:3rem;font-size:10rem;color:var(--kin);letter-spacing:4rem}
.title .hint{position:absolute;left:0;right:0;top:176rem;font-size:10rem;animation:blink 1.4s steps(2) infinite}
.title .foot{position:absolute;left:0;right:0;bottom:5rem;font-size:7rem;color:#a59fb8}
.skiphint{position:absolute;right:6rem;top:6rem;font-size:8rem;color:#a59fb8;letter-spacing:1rem}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);transition:opacity .6s;pointer-events:none}
.card .a{font-size:11rem;color:var(--kin);letter-spacing:6rem}
.card .b{font-family:var(--logo);font-size:26rem;line-height:32rem;margin-top:6rem;color:#f7eed6;text-shadow:0 0 6rem rgba(255,186,110,.5)}
.card.out{opacity:0}
@keyframes blink{50%{opacity:0}}
@keyframes hit{50%{background:rgba(214,70,58,.55)}}
/* 操作盤 */
#pad{position:fixed;touch-action:none}
#pad .arm{position:absolute;background:linear-gradient(180deg,#2c2836,#1a1721);border:2px solid #3d3749;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 #050409}
#pad .arm::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:7px solid transparent}
#pad .arm.up{left:32%;width:36%;top:0;height:40%;border-radius:12px 12px 3px 3px}
#pad .arm.up::after{border-bottom:9px solid #6d6680;margin-top:-4px}
#pad .arm.down{left:32%;width:36%;bottom:0;height:40%;border-radius:3px 3px 12px 12px}
#pad .arm.down::after{border-top:9px solid #6d6680;margin-top:4px}
#pad .arm.left{top:32%;height:36%;left:0;width:40%;border-radius:12px 3px 3px 12px}
#pad .arm.left::after{border-right:9px solid #6d6680;margin-left:-4px}
#pad .arm.right{top:32%;height:36%;right:0;width:40%;border-radius:3px 12px 12px 3px}
#pad .arm.right::after{border-left:9px solid #6d6680;margin-left:4px}
#pad .hub{position:absolute;left:30%;top:30%;width:40%;height:40%;background:#1f1b28;border-radius:6px}
#pad.d-up .arm.up,#pad.d-down .arm.down,#pad.d-left .arm.left,#pad.d-right .arm.right{background:linear-gradient(180deg,#463f55,#2c2737);box-shadow:inset 0 2px 4px rgba(0,0,0,.5);transform:translateY(2px)}
.btn,.pill{position:fixed;-webkit-appearance:none;appearance:none;margin:0;padding:0;outline:none;touch-action:none;cursor:pointer;color:#fff}
.btn{border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 26px/1 var(--ui);
  box-shadow:0 5px 0 #050409,inset 0 2px 0 rgba(255,255,255,.25)}
.btn small{font-size:11px;font-weight:400;opacity:.9;letter-spacing:1px}
#bA{background:radial-gradient(circle at 38% 32%,#e46a48,var(--shu) 58%,#8a2618)}
#bB{background:radial-gradient(circle at 38% 32%,#5468b0,var(--ai) 58%,#18203f)}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #050409,inset 0 2px 0 rgba(255,255,255,.18)}
.pill{height:34px;border-radius:17px;border:1px solid #3d3749;background:#1a1721;font:14px/32px var(--ui);letter-spacing:3px;box-shadow:0 3px 0 #050409;color:var(--washi)}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 #050409}
.btn:focus-visible,.pill:focus-visible{box-shadow:0 0 0 3px var(--kin)}
@media (prefers-reduced-motion:reduce){.opt.sel::before,.msg .more,.title .hint{animation:none}}
.lvup{padding:4rem 7rem;z-index:30;font-size:9.5rem;line-height:12.5rem}
.lvup .lvh{margin-bottom:3rem;color:#f3d44c}
.lvup .lvh b{font-size:1.15em}
.lvup table{border-collapse:collapse;margin:0 auto}
.lvup td{padding:0 2rem;white-space:nowrap}
.lvup td.n{text-align:right;min-width:2.2em}
.lvup td.d{color:#9fe870;min-width:2.5em}
.lvup tr:not(.up){opacity:.55}
</style>

<body>
<div id="screen"><canvas id="cv" width="240" height="240"></canvas><div id="ui"></div></div>
<div id="pad" aria-label="十字キー"><i class="arm up"></i><i class="arm down"></i><i class="arm left"></i><i class="arm right"></i><i class="hub"></i></div>
<button id="bA" class="btn" aria-label="A 決定">A<small>決定</small></button>
<button id="bB" class="btn" aria-label="B 戻る">B<small>戻る</small></button>
<button id="bM" class="pill" aria-label="メニュー">メニュー</button>
<script>
'use strict';
/* =====================================================================
   00 CORE  定数・乱数・ドット絵の下地
   ===================================================================== */
const TS = 16, VW = 240, VH = 240;
let RNG = Math.random;
const rand = () => RNG();
const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const DEBUG = { fast: false, overflow: [] };
const S_PX = () => parseFloat(document.documentElement.style.fontSize) || 1;
const sleep = ms => new Promise(r => setTimeout(r, DEBUG.fast ? 0 : ms));
function seeded(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s = 0) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h | 0; }

/* 共通パレット（1文字 = 1色） */
const PAL = {
  k: '#14121c', K: '#2b2838', w: '#f4f0e2', W: '#cfc8b4', e: '#8d8b94', E: '#5b5966',
  g: '#62a544', G: '#3f7f38', h: '#93cc5c', d: '#2a5a30',
  b: '#3d7fd6', B: '#2a55aa', c: '#8fd2f2', C: '#dff3fa',
  n: '#9c6b3e', N: '#6a4426', t: '#c99a5e', T: '#e6cb8e',
  s: '#f3c9a2', S: '#d59a72',
  r: '#d6463a', R: '#96291f', o: '#e98b2e', y: '#f3d44c', Y: '#b8912c',
  p: '#8b5cc9', P: '#56318c', i: '#ea7dab',
  m: '#7c8198', M: '#4d5169', l: '#aab0c3',
  u: '#3b2c4c', U: '#251b32', v: '#6c5c7d', V: '#4b3e5c',
};
const colOf = c => (c && c.length === 1) ? PAL[c] : c;

/* 画素バッファ。図形を置いてから canvas に焼く */
class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  set(x, y, c) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = colOf(c); }
  get(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; return this.d[y * this.w + x]; }
  fill(c) { this.d.fill(colOf(c)); return this; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  hl(x, y, w, c) { return this.rect(x, y, w, 1, c); }
  vl(x, y, h, c) { return this.rect(x, y, 1, h, c); }
  ell(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    return this;
  }
  line(x0, y0, x1, y1, c, t = 1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy; const o = Math.floor((t - 1) / 2);
    for (;;) {
      this.rect(x0 - o, y0 - o, t, t, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  }
  poly(pts, c) {
    let minY = Infinity, maxY = -Infinity;
    for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      const xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x <= Math.round(xs[i + 1]); x++) this.set(x, y, c);
    }
    return this;
  }
  /* 文字列の絵を置く。'.' は透明。map で文字→色を差し替えられる */
  strs(rows, map, dx = 0, dy = 0, flip = false) {
    for (let y = 0; y < rows.length; y++) {
      const r = rows[y];
      for (let x = 0; x < r.length; x++) {
        const ch = r[flip ? r.length - 1 - x : x];
        if (ch === '.' || ch === ' ') continue;
        const c = map && map[ch] !== undefined ? map[ch] : PAL[ch];
        if (c) this.set(dx + x, dy + y, c);
      }
    }
    return this;
  }
  /* 不透明な画素のまわりに縁取りを付ける */
  outline(c = 'k', diag = false) {
    const o = this.d.slice(), w = this.w, h = this.h, col = colOf(c);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (o[y * w + x]) continue;
      const n = (x > 0 && o[y * w + x - 1]) || (x < w - 1 && o[y * w + x + 1]) || (y > 0 && o[(y - 1) * w + x]) || (y < h - 1 && o[(y + 1) * w + x]) ||
        (diag && ((x > 0 && y > 0 && o[(y - 1) * w + x - 1]) || (x < w - 1 && y > 0 && o[(y - 1) * w + x + 1]) || (x > 0 && y < h - 1 && o[(y + 1) * w + x - 1]) || (x < w - 1 && y < h - 1 && o[(y + 1) * w + x + 1])));
      if (n) this.d[y * w + x] = col;
    }
    return this;
  }
  /* 乱数で点を散らす */
  speck(c, n, r, x0 = 0, y0 = 0, w = this.w, h = this.h) { for (let i = 0; i < n; i++) this.set(x0 + Math.floor(r() * w), y0 + Math.floor(r() * h), c); return this; }
  /* 市松の網点（グラデーション用） */
  dither(x, y, w, h, c, phase = 0) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (((x + i + y + j + phase) & 1) === 0) this.set(x + i, y + j, c); return this; }
  blit(src, dx = 0, dy = 0, flip = false) {
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const c = src.d[y * src.w + (flip ? src.w - 1 - x : x)];
      if (c) this.set(dx + x, dy + y, c);
    }
    return this;
  }
  /* 色の置き換え（色違いの敵など） */
  recolor(map) { const m = {}; for (const k in map) m[colOf(k)] = colOf(map[k]); const p = new Pix(this.w, this.h); p.d = this.d.map(c => c && m[c] ? m[c] : c); return p; }
  toCanvas() {
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const x = c.getContext('2d'), im = x.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i]; if (!col) continue;
      const n = parseInt(col.slice(1), 16);
      im.data[i * 4] = n >> 16 & 255; im.data[i * 4 + 1] = n >> 8 & 255; im.data[i * 4 + 2] = n & 255; im.data[i * 4 + 3] = 255;
    }
    x.putImageData(im, 0, 0); return c;
  }
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* =====================================================================
   10 TILES  地形・建物・家具のドット絵（すべて自作）
   ===================================================================== */
const TILE = {};
function defTile(name, fn, frames = 1) {
  const arr = [];
  for (let f = 0; f < frames; f++) { const p = new Pix(16, 16); fn(p, seeded(hashStr(name)), f); arr.push(p.toCanvas()); }
  TILE[name] = arr;
}
function grassBase(p, r) { p.fill('g'); p.speck('G', 7, r); p.speck('h', 5, r); }
function tuft(p, x, y) { p.set(x, y, 'G'); p.set(x - 1, y - 1, 'G'); p.set(x + 1, y - 1, 'G'); p.set(x, y - 1, 'h'); p.set(x - 1, y - 2, 'h'); p.set(x + 1, y - 2, 'h'); }
function flower(p, x, y, c) { p.set(x, y, 'y'); p.set(x - 1, y, c); p.set(x + 1, y, c); p.set(x, y - 1, c); p.set(x, y + 1, c); }
function buildTiles() {
  /* ---- 野外の地面 ---- */
  defTile('grass0', (p, r) => grassBase(p, r));
  defTile('grass1', (p, r) => { grassBase(p, r); tuft(p, 4, 10); tuft(p, 11, 5); });
  defTile('grass2', (p, r) => { grassBase(p, r); tuft(p, 12, 12); p.set(3, 4, 'h'); p.set(4, 4, 'h'); });

/* =====================================================================
   14 PICS  一枚絵と紙芝居（あいもんに描かせた絵）。PICS[キー] = 画像のdataURL
   画面の上 240×160 に絵を出し、下に会話窓。切り替えは右から左へ一方向に抜くだけ
   ===================================================================== */
const PICS = {};
const Pic = (() => {
  let box = null, cur = null;
  function ensure() {
    if (box) return box;
    box = UI.el('div', 'picbox');
    box.style.cssText = 'position:absolute;left:0;top:0;width:240rem;height:240rem;overflow:hidden;background:#000;pointer-events:none';
    UI.root.insertBefore(box, UI.root.firstChild); return box;
  }
  function mk(key, o) {
    const im = document.createElement('img'); im.src = PICS[key];
    im.style.cssText = 'position:absolute;left:0;top:0;width:240rem;height:160rem;object-fit:cover;image-rendering:auto;transition:transform .35s ease-out' + (o && o.past ? ';filter:sepia(.6) saturate(.5) brightness(.85)' : '');
    return im;
  }
  async function show(key, o = {}) {
    if (!PICS[key]) return false;
    const b = ensure(), im = mk(key, o);
    if (!cur || DEBUG.fast) { b.innerHTML = ''; b.appendChild(im); cur = im; return true; }
    im.style.transform = 'translateX(240rem)'; b.appendChild(im);
    const old = cur; cur = im;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    im.style.transform = 'translateX(0)'; old.style.transform = 'translateX(-240rem)';
    await sleep(360); old.remove();
    return true;
  }
  /* 建物の一枚絵：背景＋人物（腰から上、白抜き）。人物は左寄せ、右側はメニューが出る */
  async function scene(bg, who) {
    if (!PICS[bg]) return false;
    const b = ensure(); b.innerHTML = ''; cur = null;
    const a = mk(bg); b.appendChild(a); cur = a;
    if (who && PICS[who]) { const p = document.createElement('img'); p.src = PICS[who]; p.style.cssText = 'position:absolute;left:6rem;bottom:80rem;height:150rem;width:auto'; b.appendChild(p); }
    return true;
  }
  function hide() { if (box) { box.remove(); box = null; cur = null; } }
  return { show, scene, hide, has: k => !!PICS[k] };
})();

      case 'bark': tone(d, 0.5, 520, t, 0.07, 0.22, { slide: 380 }); tone(d, 0.5, 560, t + 0.12, 0.08, 0.2, { slide: 400 }); break;
      case 'spell': [440, 554, 659, 880].forEach((f, i) => tone(d, 0.125, f, t + i * 0.04, 0.06, 0.1)); break;

    const tr = T[id], step = 60 / tr.bpm / 4;

    tr.chans.forEach((c, ci) => {
      if (solo != null && ci !== solo) return;
      const o = ctx.createGain(); o.connect(bgmBus);
      if (c.rev) { const sg = ctx.createGain(); sg.gain.value = c.rev; o.connect(sg); sg.connect(revIn); }
      let t = 0.05, i = 0;
      while (t < secs - 0.5) { const e = c.ev[i < c.ev.length ? i : (c.ls || 0) + (i - c.ev.length) % (c.ev.length - (c.ls || 0))], dur = e.len * step; if (e.n) { if (c.w === 'drum') drum(o, e.n, t, c.v); else if (!inst(o, c.w, freq(midi(e.n)), t, dur * 0.95, c.v)) tone(o, c.w, freq(midi(e.n)), t, dur * 0.95, c.v, {}); } t += dur; i++; if (!tr.loop && i >= c.ev.length) break; }
    });

  }

      if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hash2(x, y, seed) - 0.5) * 0.5 < 1 && (!keep || !keep.includes(get(x, y)))) set(x, y, c);

    const d = Math.min(x, y, WORLD_W - 1 - x, WORLD_H - 1 - y);
    if (d === 0 || (d === 1 && hash2(x, y, 5) < 0.6)) set(x, y, 'M');

  for (let y = 1; y < WORLD_H - 1; y++) {

  }

  road(14, 49, 14, 51);                    // 関所の向こう（行けない）
  road(57, 30, 62, 30); road(62, 30, 62, 40); road(62, 40, 64, 40);  // 湖の岸へ
  road(57, 22, 66, 22);                    // 沼への細道

  mark('temple', 'R'); mark('shrine', 'S'); mark('pine', 'P'); mark('sign', 'I');
  for (const [x, y] of [[13, 9], [15, 9], [13, 8], [14, 8], [15, 8]]) set(x, y, 'T');
  for (const [x, y] of [[56, 12], [58, 12], [56, 11], [57, 11], [58, 11]]) set(x, y, 'M');

function compileMap(id) {
  const def = MAPS[id]; if (!def) throw new Error('no map ' + id);
  const rows = def.rows, h = rows.length, w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) throw new Error(id + ' row ' + i + ' len ' + r.length + ' != ' + w); });
  const L = LEGENDS[def.kind];
  const tiles = [], pass = [];
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? null : rows[y][x];
  const chestCells = [];
  for (let y = 0; y < h; y++) {

    for (let x = 0; x < w; x++) {
      const ch = rows[y][x], ent = L[ch];
      if (ent === undefined) throw new Error(id + ' unknown char "' + ch + '" at ' + x + ',' + y);
      let [name, p] = Array.isArray(ent) ? ent : [ent, 1];
      const hh = hash2(x, y, hashStr(id));

      } else if (name === 'WALL') {
        const isW = c => c && 'WDIANB'.includes(c);
        name = !isW(at(x - 1, y)) ? 'wallL' : !isW(at(x + 1, y)) ? 'wallR' : (x % 2 ? 'wallM' : 'wallP');
      } else if (name === 'CWALL') name = (at(x, y + 1) && at(x, y + 1) !== '#') ? 'cwallFace' : 'cwallTop';
      else if (name === 'CHEST') { chestCells.push([x, y]); name = def.kind === 'cave' ? 'cfloor' : def.kind === 'in' ? 'wood' : 'grass0'; }
      if (STORY[id] && STORY[id].tile) { const t = STORY[id].tile(name, p); if (Array.isArray(t)) [name, p] = t; else name = t; }
      if (!TILE[name]) throw new Error(id + ' missing tile ' + name);

/* ---------------- 毎フレームの更新 ---------------- */

/* =====================================================================
   42 BATTLE  コマンド式の戦い（画面なしの試算にも同じ処理を使う）
   ===================================================================== */
let B = null;
function wpick(list) { let s = 0; for (const [w] of list) s += w; let r = rand() * s; for (const [w, v] of list) { r -= w; if (r < 0) return v; } return list[list.length - 1][1]; }
function makeEnemies(ids, mul = 1) {
  const cnt = {}, seen = {};
  for (const id of ids) cnt[id] = (cnt[id] || 0) + 1;
  return ids.map(id => {
    const d = ENEMIES[id]; seen[id] = (seen[id] || 0) + 1;
    const label = d.name + (cnt[id] > 1 ? 'ABCDE'[seen[id] - 1] : '');
    const hp = Math.max(1, Math.round(d.hp * mul));
    return { id, d, name: label, hp, max: hp, mul, atk: Math.round(d.atk * mul), sleep: 0, poison: false, alpha: 1, flash: 0, shake: 0 };
  });
}
const liveEn = () => B.en.filter(e => e.hp > 0);
const liveP = () => B.party.filter(m => m.hp > 0);
const elemMul = (d, el) => !el ? 1 : (d.weak || []).includes(el) ? 1.5 : (d.resist || []).includes(el) ? 0.5 : 1;
function physDamage(atk, def, mult = 1) {
  let v = (atk / 2 - def / 4) * mult * (0.875 + rand() * 0.25);
  if (v < 1) return rand() < 0.5 ? 0 : 1;
  return Math.round(v);
}
const pDef = m => Math.round(stat(m, 'def') * (B.kamae ? 1.4 : 1));

/* -------- 出力（画面あり／なし） -------- */
async function out(text, ms) { if (B.sim) return; BUI.log(text); await BUI.wait(ms); }
async function fx(kind, a) { if (B.sim) return; await BUI.fx(kind, a); }

/* -------- 戦いの入口 -------- */
async function startRandomBattle(zone) {
  const z = ENC[zone];
  return battle(wpick(z.groups), { bg: z.bg });
}
async function battle(ids, opt = {}) {
  B = { en: makeEnemies(ids, opt.solo ? 0.8 : 1), party: G.party, bg: opt.bg || 'field', boss: !!opt.boss, kamae: false, guard: new Set(), runFails: 0, sim: !!opt.sim, policy: opt.policy, round: 0, opt };
  if (!B.sim) { G.mode = 'battle'; await BUI.enter(opt); }
  let result;
  try {
    const names = [...new Set(B.en.map(e => e.d.name))];
    await out(opt.intro || (names.length === 1 ? names[0] + 'が ' + (B.en.length > 1 ? B.en.length + 'ひき ' : '') + 'あらわれた！' : '妖怪の むれが あらわれた！'), 900);
    result = await battleLoop();
  } finally { if (!B.sim) await BUI.leave(result, opt); }
  const r = result; B = null; return r;
}
async function battleLoop() {
  for (;;) {
    B.round++; B.guard.clear();
    // コマンド
    const cmds = [];
    if (!B.sim) BUI.status();
    const actors = B.party.filter(m => m.hp > 0);
    for (let i = 0; i < actors.length;) {
      const m = actors[i];
      if (m.sleep > 0) { cmds[i] = { who: m, type: 'sleep' }; i++; continue; }
      const c = B.sim ? B.policy(m) : DEBUG.autoBattle ? simPolicy(m) : await BUI.command(m, i);
      if (c === 'back') { do { i--; } while (i > 0 && actors[i].sleep > 0); i = Math.max(0, i); continue; }
      if (c.type === 'run') { cmds.length = 0; cmds.push({ who: m, type: 'run' }); break; }
      cmds[i] = { who: m, ...c }; i++;
    }
    if (!B.sim) BUI.hideCmd();
    // にげる
    if (cmds[0] && cmds[0].type === 'run') {
      if (!B.sim) BUI.clear();
      await out(mName(B.party[0]) + 'たちは にげだした！', 500);
      if (B.boss) { await out('しかし 逃げられない！', 800); }
      else {
        const pa = liveP().reduce((s, m) => s + stat(m, 'agi'), 0) / liveP().length, ea = liveEn().reduce((s, e) => s + e.d.agi, 0) / liveEn().length;
        const p = clamp(0.5 + (pa - ea) * 0.03 + B.runFails * 0.15, 0.2, 0.95);
        if (rand() < p) { SND.sfx('run'); await fx('run'); return 'run'; }
        B.runFails++; await out('しかし まわりこまれてしまった！', 800);
      }
      cmds.length = 0;
    }
    // 敵の行動
    const acts = cmds.filter(Boolean).map(c => ({ ...c, side: 'p', spd: stat(c.who, 'agi') * (0.6 + rand() * 0.6) }));
    for (const e of liveEn()) for (let k = 0; k < (e.d.acts || 1); k++) acts.push({ who: e, side: 'e', spd: e.d.agi * (0.6 + rand() * 0.6) - k * 4 });
    for (const a of acts) if (a.type === 'guard') B.guard.add(a.who);
    acts.sort((a, b) => b.spd - a.spd);
    for (const a of acts) {
      if (a.who.hp <= 0) continue;
      if (!B.sim) BUI.clear();
      if (a.side === 'p') await partyAct(a); else await enemyAct(a.who);
      if (!B.sim) BUI.status();
      if (!liveEn().length) return await victory();
      if (!liveP().length) return await defeat();
      if (B.opt.rescue && !B.rescued && (B.party[0].hp <= stat(B.party[0], 'hp') * 0.3 || B.round >= 4)) { B.rescued = true; await B.opt.rescue(); if (!B.sim) BUI.status(); break; }
    }
    // ターンの終わり
    if (!B.sim) BUI.clear();
    for (const m of liveP()) {
      if (m.poison) { const v = Math.max(2, Math.floor(stat(m, 'hp') / 20)); m.hp = Math.max(0, m.hp - v); await out(mName(m) + 'は 毒で ' + v + 'の ダメージ！', 500); if (m.hp <= 0) await out(mName(m) + 'は 倒れた……', 600); }
    }
    for (const e of liveEn()) if (e.sleep > 0 && --e.sleep === 0) await out(e.name + 'は 目をさました！', 400);
    if (!B.sim) BUI.status();
    if (!liveP().length) return await defeat();
  }
}
/* -------- 味方の行動 -------- */
function retarget(t) { if (t && t.hp > 0) return t; const l = liveEn(); return l.length ? pick(l) : null; }
async function hitEnemy(m, t, mult, opt = {}) {
  t = retarget(t); if (!t) return;
  const crit = !opt.noCrit && rand() < 1 / 24;
  const miss = !crit && rand() < (opt.acc ? 1 - opt.acc : 1 / 30);
  if (miss) { SND.sfx('miss'); await out('ミス！ ' + t.name + 'は ひらりと かわした！', 600); return; }
  let v = crit ? Math.round(stat(m, 'atk') * mult * (0.9 + rand() * 0.2) * 0.72) : physDamage(stat(m, 'atk'), t.d.def, mult);
  v = Math.round(v * elemMul(t.d, opt.elem));
  if (crit) { SND.sfx('crit'); await fx('crit'); await out('会心の一撃！', 300); }
  else SND.sfx(opt.elem === 'water' ? 'water' : 'hit');
  await damageEnemy(t, v);
}
async function damageEnemy(t, v) {
  t.hp = Math.max(0, t.hp - v); if (t.sleep && v > 0 && rand() < 0.6) t.sleep = 0;
  await fx('ehit', t);
  await out(v > 0 ? t.name + 'に ' + v + 'の ダメージ！' : 'ミス！ ' + t.name + 'に ダメージを あたえられない！', 550);
  if (t.hp <= 0) { SND.sfx('die'); await fx('edie', t); await out(t.name + 'を たおした！', 600); }
}
async function partyAct(a) {
  const m = a.who;
  if (a.type === 'sleep') {
    if (rand() < 0.45 || m.sleep === 1) { m.sleep = 0; await out(mName(m) + 'は 動けるように なった！', 600); }
    else { m.sleep--; await out(mName(m) + 'は 動けない……', 600); }
    return;
  }
  if (m.sleep > 0) { await out(mName(m) + 'は 動けない！', 500); return; }
  if (a.type === 'attack') { await out(mName(m) + 'の こうげき！', 350); await hitEnemy(m, a.target, 1); return; }
  if (a.type === 'guard') { await out(mName(m) + 'は 身を まもっている。', 500); return; }
  if (a.type === 'item') {
    const it = ITEMS[a.item];
    if (!G.bag[a.item]) { await out(mName(m) + 'は ' + it.name + 'を さがしたが\nもう なかった！', 600); return; }
    await out(mName(m) + 'は ' + it.name + 'を つかった！', 450);
    let tgt = a.target; if (it.target === 'ally' && tgt && tgt.hp <= 0) tgt = null;
    const r = tgt || it.target === 'dead' ? applyItem(a.item, tgt) : null;
    if (!r) { await out('しかし なにも おこらなかった。', 500); return; }
    if (!r.fail) removeItem(a.item);
    if (r.sfx) { SND.sfx(r.sfx); await fx('heal', tgt); }
    await out(r.text, 600); return;
  }
  if (a.type === 'skill') {
    const s = SKILLS[a.skill];
    if (m.mp < s.mp) { await out(mName(m) + 'は ' + s.name + 'を つかおうとしたが\n気が たりない！', 600); return; }
    m.mp -= s.mp;
    const verb = s.kind === 'magic' ? 'を となえた！' : s.kind === 'heal' || s.kind === 'healall' ? 'を ささげた！' : s.kind === 'guard' ? 'を とった！' : s.kind === 'cure' ? 'を ほどこした！' : 'を はなった！';
    await out(mName(m) + 'は ' + s.name + verb, 450);
    if (s.kind === 'phys' && s.target === 'enemy') { await hitEnemy(m, a.target, s.mult, { acc: s.acc, elem: s.elem }); return; }
    if (s.kind === 'phys' && s.target === 'enemies') {
      SND.sfx('water'); await fx('water');
      for (const t of liveEn()) { const v = Math.round(physDamage(stat(m, 'atk'), t.d.def, s.mult) * elemMul(t.d, s.elem)); await damageEnemy(t, v); }
      return;
    }
    if (s.kind === 'magic') {
      SND.sfx(s.elem === 'fire' ? 'fire' : 'spell'); await fx(s.elem || 'spell', s.target === 'enemy' ? retarget(a.target) : null);
      const ts = s.target === 'enemies' ? liveEn() : [retarget(a.target)].filter(Boolean);

  const nm = { atk: '力', def: '守り', agi: '素早さ', hp: '最大HP', mp: '最大気' };
  const parts = Object.keys(nm).filter(k => u.d[k] > 0).map(k => nm[k] + '+' + u.d[k]);
  if (parts.length) L.push(parts.slice(0, 3).join(' ') + (parts.length > 3 ? '\n' + parts.slice(3).join(' ') : ''));
  let t = L.join('\n');
  for (const s of u.learned) t += '|' + mName(m) + 'は 「' + SKILLS[s].name + '」を\nおぼえた！';
  return t;
}
/* 道具袋 */
function addItem(id, n = 1) { G.bag[id] = (G.bag[id] || 0) + n; }
function removeItem(id, n = 1) { G.bag[id] = (G.bag[id] || 0) - n; if (G.bag[id] <= 0) delete G.bag[id]; }
const hasItem = id => (G.bag[id] || 0) > 0 || G.party.some(m => m.w === id || m.a === id);
const itemName = id => ITEMS[id].name;
function joinParty(id, lv) {
  if (G.party.some(m => m.id === id)) return null;
  const m = newMember(id, lv); G.party.push(m);
  if (id === 'sosuke') { m.w = 'rokushaku'; m.a = 'nuno'; }
  if (id === 'dosetsu') { m.w = 'dosetsuto'; m.a = 'shirosho'; }
  m.hp = stat(m, 'hp'); m.mp = stat(m, 'mp');
  if (G.pl) refreshFollowers();
  return m;
}
const alive = () => G.party.filter(m => m.hp > 0);
function healAll() { for (const m of G.party) { m.hp = stat(m, 'hp'); m.mp = stat(m, 'mp'); m.poison = false; } }
/* 道具の効き目（戦闘でも野原でも使う） */
function applyItem(id, tgt) {
  const e = ITEMS[id].eff, nm = tgt ? mName(tgt) : '';
  if (e.heal) { if (!tgt || tgt.hp <= 0) return null; const v = Math.min(stat(tgt, 'hp') - tgt.hp, ri(e.heal[0], e.heal[1])); tgt.hp += v; return { text: nm + 'の HPが ' + v + ' 回復した！', sfx: 'heal' }; }
  if (e.mp) { if (!tgt || tgt.hp <= 0) return null; const v = Math.min(stat(tgt, 'mp') - tgt.mp, ri(e.mp[0], e.mp[1])); tgt.mp += v; return { text: nm + 'の 気が ' + v + ' 回復した！', sfx: 'heal' }; }
  if (e.cure) { if (!tgt || tgt.hp <= 0) return null; if (!tgt.poison) return { text: nm + 'は 毒を うけていない。', fail: true }; tgt.poison = false; return { text: nm + 'の 毒が 消えた！', sfx: 'heal' }; }
  if (e.revive) { if (!tgt || tgt.hp > 0) return { text: nm + 'は 倒れていない。', fail: true }; tgt.hp = Math.ceil(stat(tgt, 'hp') * e.revive); tgt.poison = false; return { text: nm + 'が 生き返った！', sfx: 'heal' }; }
  if (e.stat) { tgt.bonus[e.stat[0]] += e.stat[1]; return { text: nm + 'の ' + (e.stat[0] === 'atk' ? '力' : '守り') + 'が ' + e.stat[1] + ' 上がった！', sfx: 'buff' }; }
  if (e.mayoke) { G.mayoke = e.mayoke; return { text: '魔除けの香を たいた。\nあたりに 清らかな香りが ただよう。', sfx: 'shine' }; }
  return null;
}

async function shopBuy(list, gp, o) {
  let start = 0;

    const desc = UI.info({ x: 8, y: 180, w: 224, cls: 'desc' });
    const who = id => { const it = ITEMS[id]; if (it.kind === 'w' || it.kind === 'a') { const ms = G.party.filter(m => canEquip(m, id)).map(mName); return ms.length ? ms.join('・') + 'が そうびできる' : 'いまの仲間は そうびできない'; } return it.desc; };
    const i = await UI.choose(list.map(id => ({ label: itemName(id), right: ITEMS[id].price })), { x: 104, y: 8, w: 128, rows: 9, start, onMove: k => { const id = list[k]; const it = ITEMS[id]; desc.textContent = it.desc + (it.atk ? '（力+' + it.atk + '）' : it.def ? '（守り+' + it.def + '）' : '') + ((it.kind === 'w' || it.kind === 'a') ? '\n' + who(id) : ''); } });

   45 FX  光と影の演出（地図・戦闘）

const FX = (() => {
  let parts = [], bparts = [], slashes = [];
  const cache = {};
  let maskC = null, mask = null;
  function glow(color, r) {
    const k = color + r; if (cache[k]) return cache[k];
    const c = mkCanvas(r * 2, r * 2), x = c.getContext('2d'), g = x.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, color); g.addColorStop(0.35, color.replace(/[\d.]+\)$/, m => (parseFloat(m) * 0.45) + ')')); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, r * 2, r * 2); return (cache[k] = c);
  }
  function vignette(a) {
    const k = 'v' + a; if (cache[k]) return cache[k];
    const c = mkCanvas(VW, VH), x = c.getContext('2d'), g = x.createRadialGradient(VW / 2, VH / 2, VW * 0.32, VW / 2, VH / 2, VW * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + a + ')'); x.fillStyle = g; x.fillRect(0, 0, VW, VH); return (cache[k] = c);
  }
  function cloud() {
    if (cache.cloud) return cache.cloud;
    const c = mkCanvas(160, 80), x = c.getContext('2d');
    for (const [cx0, cy0, r] of [[50, 42, 34], [88, 36, 40], [120, 46, 30], [74, 50, 30]]) { const g = x.createRadialGradient(cx0, cy0, 0, cx0, cy0, r); g.addColorStop(0, 'rgba(10,20,50,0.16)'); g.addColorStop(1, 'rgba(10,20,50,0)'); x.fillStyle = g; x.fillRect(0, 0, 160, 80); }
    return (cache.cloud = c);
  }
  function sunTint() {
    if (cache.sun) return cache.sun;
    const c = mkCanvas(VW, VH), x = c.getContext('2d'), g = x.createLinearGradient(0, 0, VW * 0.6, VH);

};
const talk = (name, ...pages) => async () => { for (const p of pages) await say(p, { name }); };
async function getItem(id, text) {
  addItem(id); SND.stopBgm(); await SND.jingle('item'); SND.bgm(G.map.def.bgm);
  await say(text || mName(G.party[0]) + 'は ' + itemName(id) + 'を 手に入れた！');
}
function chest(id, x, y, content) {
  return { type: 'chest', id, x, y, block: true, run: async () => {
    if (G.opened[id]) { await say('宝箱は からっぽだ。'); return; }
    G.opened[id] = true; SND.sfx('chest');
    if (content.gold) { G.gold += content.gold; await say('宝箱を あけた。|' + content.gold + '文 入っていた！'); return; }
    await say('宝箱を あけた。'); await getItem(content.item);
  } };
}
function look(x, y, text, o = {}) { return { type: 'look', x, y, block: o.block !== false, cond: o.cond, run: typeof text === 'function' ? text : async () => { for (const p of [].concat(text)) await say(p); } }; }
function pot(id, x, y, item) {
  return { type: 'pot', x, y, block: true, run: async () => {
    if (G.opened[id]) { await say('つぼの中は からっぽだ。'); return; }

  } };
}
/* 戦って負けたら宿で目をさます */
async function randomFight(zone) {
  const z = ENC[zone], solo = G.party.length === 1;
  let ids = wpick(z.groups); if (solo && !z.full) ids = ids.slice(0, zone.startsWith('cave') ? 2 : 1);
  return fight(ids, { bg: z.bg, solo });
}
async function fight(ids, opt = {}) {
  for (;;) {
    const r = await battle(ids, opt);
    if (r !== 'lose') return r;
    SND.stopBgm(); UI.clearAll();
    await fadeTo(1, 600); G.mode = 'gameover';
    await SND.jingle('gameover');
    if (opt.boss) {
      const c = await ask('目の前が 真っ暗に なった……||このまま もう一度 挑みますか？|（HPと 気は 元に もどります）', ['挑む', '宿へ戻る'], { cls: 'center', cx: 150, cw: 82 });
      if (c === 0) { healAll(); G.mode = 'field'; G.fade = 0; continue; }
    } else await say('目の前が 真っ暗に なった……', { y: 92, cls: 'center' });
    await gameOver();
    return false;
  }
}
async function gameOver() {
  healAll(); G.gold = Math.floor(G.gold / 2);
  const home = G.lastInn === 'tea' ? ['teahouse', 2, 3, 'up'] : ['inn', 2, 3, 'up'];
  G.mode = 'field'; loadMap(...home);

  Save.auto();
}

/* =====================================================================
   60 MAIN  記録・題名・操作盤・起動
   ===================================================================== */
const Save = (() => {
  const KEY = 'shinhakkenden.save.v1', PKEY = 'shinhakkenden.prefs';
  let cloud = null, cloudState = 'pending', cloudData = null, lastCloud = 0, cloudTimer = null;
  const waiters = [];
  function data() {
    return { v: 1, t: Date.now(), map: G.mapId, x: G.pl.x, y: G.pl.y, dir: G.pl.dir, party: G.party.map(({ _hit, sleep, ...m }) => m), bag: G.bag, gold: G.gold,
      flags: G.flags, opened: G.opened, steps: G.steps, playTime: Math.floor(G.playTime), lastInn: G.lastInn, mayoke: G.mayoke };
  }
  function local() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeLocal(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  let pending = null, writing = false, lastJSON = '';
  async function writeCloud(d) {
    if (!cloud) return; pending = d; if (writing) return; writing = true;
    try {
      while (pending) {
        const j = JSON.stringify(pending); pending = null;
        if (j === lastJSON) continue;
        for (let k = 0; k < 3; k++) { try { await cloud.set(JSON.parse(j)); lastJSON = j; lastCloud = Date.now(); lastErr = ''; break; } catch (e) { lastErr = (e && (e.code || e.message)) || String(e); await new Promise(r => setTimeout(r, 1500 * (k + 1))); } }
      }
    } finally { writing = false; }
  }
  let status = '接続中', lastErr = '';
  async function initCloud() {
    try {
      let c = window.claude;
      for (let i = 0; i < 20 && !(c && c.use); i++) { await new Promise(r => setTimeout(r, 250)); c = window.claude; }
      if (!c || !c.use) { status = 'この画面では使えません（claude なし）'; throw 0; }
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db) { status = 'この画面では使えません（db なし）'; throw 0; }
      let id = user ? await user.id() : null;
      for (let i = 0; i < 6 && !id && user; i++) { await new Promise(r => setTimeout(r, 500)); id = await user.id(); }
      if (!id) { status = 'サインイン情報が取れません'; throw 0; }
      cloud = db.doc('data/users/' + id + '/save1');
      try {
        const snap = await Promise.race([cloud.get(), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 12000))]);
        cloudData = snap && snap.exists ? snap.data() : null;
        status = '接続OK';
      } catch (e) { status = '読み込み失敗（' + ((e && e.code) || e) + '）'; }
      cloudState = 'ready';
    } catch (e) { if (!cloud) cloudState = 'none'; }
    waiters.splice(0).forEach(f => f());
  }
  function waitCloud(ms) { if (cloudState !== 'pending') return Promise.resolve(); return new Promise(res => { waiters.push(res); setTimeout(res, ms); }); }
  function newest() { const a = local(), b = cloudData; if (!a) return b; if (!b) return a; return (b.t || 0) > (a.t || 0) ? b : a; }
  return {
    data, initCloud, waitCloud, newest, hasAny: () => !!newest(),
    async save() { if (!G.pl) return; const d = data(); writeLocal(d); cloudData = d; writeCloud(d); for (let i = 0; i < 40 && writing; i++) await new Promise(r => setTimeout(r, 100)); },
    auto() {
      if (!G.pl || !G.party.length || G.mode === 'title' || G.mode === 'prologue') return;
      const d = data(); writeLocal(d); cloudData = d; writeCloud(d);
    },
    where() { const d = newest(); if (!d) return ''; const m = MAPS[d.map]; const p = d.party[0]; const t = Math.floor((d.playTime || 0) / 60); return (m ? m.name : '') + '　Lv' + p.lv + '　' + Math.floor(t / 60) + '時間' + (t % 60) + '分'; },
    prefs() { try { localStorage.setItem(PKEY, JSON.stringify(G.settings)); } catch (e) {} },
    loadPrefs() { try { const p = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (p) Object.assign(G.settings, p); } catch (e) {} },
    cloudOk: () => !!cloud,
    report() {
      const t = lastCloud ? new Date(lastCloud) : null, hm = t ? t.getHours() + '時' + String(t.getMinutes()).padStart(2, '0') + '分' : 'まだ';
      return 'クラウド：' + status + '|最後に送れた時刻：' + hm + (lastErr ? '|送信エラー：' + lastErr : '');
    },
  };
})();

const Title = (() => {
  const orbs = Array.from({ length: 8 }, (_, i) => ({ a: i / 8 * Math.PI * 2, r: 0, c: ['#ff8a8a', '#ffd36b', '#9ff0a6', '#8fd2f2', '#c9a0ff', '#fff2a8', '#ffb46b', '#f5f5ff'][i] }));
  let stage = 'title', t = 0, dom = null, tapRes = null;
  function drawOrb(x, y, c, s = 1) {
    const g = cx.createRadialGradient(x, y, 0, x, y, 9 * s); g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, c); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.fillStyle = g; cx.fillRect(x - 10 * s, y - 10 * s, 20 * s, 20 * s); cx.restore();
    cx.fillStyle = '#fff'; cx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
  }
  function render(dt) {
    t += dt;
    cx.drawImage(BGS.summit, 0, 0);
    if (stage === 'title') {
      cx.fillStyle = 'rgba(8,6,20,0.35)'; cx.fillRect(0, 0, VW, VH);
      orbs.forEach((o, i) => { const a = o.a + t * 0.35; drawOrb(120 + Math.cos(a) * 78, 112 + Math.sin(a) * 26, o.c, 0.9 + Math.sin(t * 3 + i) * 0.15); });
    } else if (stage === 'beads' || stage === 'scatter') {
      cx.fillStyle = 'rgba(8,6,20,0.45)'; cx.fillRect(0, 0, VW, VH);
      const k = stage === 'scatter' ? Math.min(1, (t - orbs.t0) / 2.2) : 0;
      orbs.forEach((o, i) => {
        const r = stage === 'scatter' ? 14 + k * k * 160 : 14 + Math.sin(t * 2) * 1.5, a = o.a + t * (stage === 'scatter' ? 0.2 : 1.2);
        drawOrb(120 + Math.cos(a) * r, 104 + Math.sin(a) * r * 0.8, o.c);

    } else if (stage === 'dark') { cx.fillStyle = 'rgba(0,0,0,0.6)'; cx.fillRect(0, 0, VW, VH); }

    }
  }
  function waitTap() { return new Promise(res => { tapRes = res; if (DEBUG.auto) setTimeout(() => { const r = tapRes; tapRes = null; r && r(); }, 0); }); }

  G.mode = 'field'; loadMap('shino_house', 4, 3, 'left'); G.fade = 1; G.banner = null;
  await fadeTo(0, 700);
  await runEvent(openingEvent);
  Save.auto();
}
async function continueGame() {
  UI.root.querySelectorAll('.title').forEach(e => e.remove());
  await Save.waitCloud(2500);
  const d = Save.newest(); if (!d) { await newGame(); return; }
  await fadeTo(1, 300);
  applySave(d);
  G.mode = 'field'; loadMap(d.map, d.x, d.y, d.dir);
  await fadeTo(0, 400);
}

/* ---------------- 画面の配置と操作盤 ---------------- */
function layout() {
  const W = innerWidth, H = innerHeight, portrait = H >= W * 1.1;
  const scr = document.getElementById('screen'), pad = document.getElementById('pad'), bA = document.getElementById('bA'), bB = document.getElementById('bB'), bM = document.getElementById('bM');
  let S, sx, sy;
  if (portrait) { S = Math.floor(Math.min(W - 8, H * 0.6, 720)); sx = Math.round((W - S) / 2); sy = Math.max(4, Math.round(Math.min(16, H * 0.012))); }
  else { S = Math.floor(Math.min(H - 8, W * 0.6)); sx = Math.round((W - S) / 2); sy = Math.round((H - S) / 2); }
  Object.assign(scr.style, { left: sx + 'px', top: sy + 'px', width: S + 'px', height: S + 'px' });
  document.documentElement.style.fontSize = (S / 240) + 'px';
  let P, B, padX, padY, cy;
  if (portrait) {
    const top = sy + S, area = H - top;
    P = Math.round(Math.min(W * 0.46, area * 0.72, 230)); B = Math.round(P * 0.42);
    cy = top + area * 0.54; padX = Math.round(W * 0.05); padY = Math.round(cy - P / 2);
    place(bA, W - padX - B, cy - B * 1.05, B); place(bB, W - padX - B * 2.15, cy - B * 0.05, B);
    Object.assign(bM.style, { left: Math.round(W / 2 - 52) + 'px', top: Math.round(top + Math.max(8, area * 0.08)) + 'px', width: '104px' });
  } else {
    const side = sx; P = Math.round(Math.min(side * 0.82, H * 0.5, 220)); B = Math.round(P * 0.42);
    cy = H * 0.6; padX = Math.round((side - P) / 2); padY = Math.round(cy - P / 2);
    const rx = sx + S, rw = W - rx;
    place(bA, rx + rw * 0.55 - B / 2 + B * 0.45, cy - B * 1.05, B); place(bB, rx + rw * 0.5 - B / 2 - B * 0.6, cy - B * 0.05, B);
    Object.assign(bM.style, { left: Math.round(rx + rw / 2 - 52) + 'px', top: Math.round(Math.max(12, H * 0.12)) + 'px', width: '104px' });
  }
  Object.assign(pad.style, { left: padX + 'px', top: padY + 'px', width: P + 'px', height: P + 'px' });
  function place(e, x, y, s) { Object.assign(e.style, { left: Math.round(x) + 'px', top: Math.round(y) + 'px', width: s + 'px', height: s + 'px' }); }
}
function setupControls() {
  const pad = document.getElementById('pad'); let pid = null, cur = null;
  const setDir = d => { if (d === cur) return; if (cur) { Input.up(cur); pad.classList.remove('d-' + cur); } cur = d; if (d) { Input.down(d); pad.classList.add('d-' + d); } };
  const upd = e => {
    const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (dx * dx + dy * dy < (r.width * 0.1) ** 2) { setDir(null); return; }
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); SND.unlock(); pid = e.pointerId; try { pad.setPointerCapture(pid); } catch (_) {} upd(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
  const end = e => { if (e.pointerId === pid) { pid = null; setDir(null); } };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end); pad.addEventListener('lostpointercapture', end);
  for (const [id, k] of [['bA', 'a'], ['bB', 'b'], ['bM', 'menu']]) {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); Input.down(k); });
    const off = () => b.classList.remove('on');
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  }
  const scr = document.getElementById('screen');
  scr.addEventListener('pointerdown', e => {
    if (e.target !== cv) return;
    e.preventDefault(); SND.unlock();
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * VW, y = (e.clientY - r.top) / r.height * VH;
    if (G.mode === 'title') { Title.tap(); return; }
    if (G.mode === 'battle') { BUI.tap(x, y); return; }
    if (G.mode === 'field' && G.map) { const [camX, camY] = camera(); tapField(Math.floor((x + camX) / TS), Math.floor((y + camY) / TS)); }
  });
  for (const ev of ['touchend', 'pointerup', 'click', 'keydown']) document.addEventListener(ev, () => SND.unlock(), { passive: true });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 120));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.clear(); if (G.mode === 'field' && G.pl) Save.auto(); } });
  addEventListener('pagehide', () => { if (G.mode === 'field' && G.pl) Save.auto(); });
  setInterval(() => { if (G.mode === 'field' && G.pl && !G.lock && !UI.top()) Save.auto(); }, 20000);
}

/* ---------------- 毎フレーム ---------------- */
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0); lastT = now; G.time += dt; G.dt = dt;
  try {
    if (G.mode === 'field' && G.map) { updateField(dt); renderField(); G.playTime += dt; }
    else if (G.mode === 'battle' && B) { BUI.render(dt); G.playTime += dt; }
    else if (G.mode === 'title' || G.mode === 'prologue' || G.mode === 'ending') Title.render(dt);
    else { cx.fillStyle = '#000'; cx.fillRect(0, 0, VW, VH); }
    renderOverlays(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function boot(hot) {
  cv = document.getElementById('cv'); cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
  buildTiles(); buildChars(); buildEnemies(); applyYokaiArt();
  UI.init(); layout(); setupControls();
  Save.loadPrefs(); SND.setOn(G.settings.sound);
  Save.initCloud();
  window.claude?.hot?.snapshot?.(() => (G.mode === 'field' && G.pl) ? Save.data() : {});
  requestAnimationFrame(frame);
  if (hot && hot.party) { applySave(hot); G.mode = 'field'; loadMap(hot.map, hot.x, hot.y, hot.dir); return; }
  Title.show();
}
/* 試験用の入口（遊ぶ人には関係なし） */
window.__fight = (ids, o) => fight(ids, o || {});
window.__rf = zone => randomFight(zone);
window.__T = { G, DEBUG, SND, tapField, interact, npc, fieldMenu, shop, inn, BUI, get B() { return B; }, MEMBERS, ITEMS, skillsOf, wpick, loadMap, battle, joinParty, newMember, setFlag, flag, stat, gainExp, addItem, Save, compileMap, MAPS, STORY, ENEMIES, ENC, Title, UI, healAll, runEvent, warp, newGame, applySave, resetGame,
  async sim(partyDef, ids, n = 200, seed = 1, bag = { yakusou: 6 }, boss = true, solo = false) {
    const save = { party: G.party, bag: G.bag, gold: G.gold }; RNG = seeded(seed);
    let wins = 0, hpLeft = 0, rounds = 0;
    for (let i = 0; i < n; i++) {
      G.party = partyDef.map(([id, lv, w, a, extra]) => { const m = newMember(id, lv); m.w = w; m.a = a; if (extra) Object.assign(m.bonus, extra); m.hp = stat(m, 'hp'); m.mp = stat(m, 'mp'); return m; });
      G.bag = { ...bag }; G.gold = 100;
      let rr = 0; const res = await battle(ids, { sim: true, boss, solo, policy: m => { rr = B.round; return simPolicy(m); } });
      rounds += rr;
      if (res === 'win') { wins++; hpLeft += G.party.reduce((s, m) => s + m.hp / stat(m, 'hp'), 0) / G.party.length; }
    }
    G.party = save.party; G.bag = save.bag; G.gold = save.gold; RNG = Math.random;
    return { win: wins / n, hpLeftAvg: wins ? +(hpLeft / wins).toFixed(2) : 0, rounds: +(rounds / n).toFixed(1) };
  },
};
function simPolicy(m) {
  const sk = skillsOf(m), hurt = liveP().filter(x => x.hp < stat(x, 'hp') * 0.4).sort((a, b) => a.hp - b.hp);
  const en = liveEn().sort((a, b) => a.hp - b.hp)[0];
  if (hurt.length >= 2 && sk.includes('chunoinori') && m.mp >= 8) return { type: 'skill', skill: 'chunoinori' };
  const pois = liveP().find(x => x.poison);
  if (pois && sk.includes('dokunuki') && m.mp >= 2 && !hurt.length) return { type: 'skill', skill: 'dokunuki', target: pois };
  if (hurt.length) {
    for (const s of ['kounohikari', 'teate']) if (sk.includes(s) && m.mp >= SKILLS[s].mp) return { type: 'skill', skill: s, target: hurt[0] };
    if (G.bag.yakusou) return { type: 'item', item: 'yakusou', target: hurt[0] };
  }
  if (sk.includes('kamae') && !B.kamae && B.boss && m.mp >= 3) return { type: 'skill', skill: 'kamae' };
  if (sk.includes('murasame') && liveEn().length > 1 && m.mp >= 6) return { type: 'skill', skill: 'murasame' };
  if (sk.includes('murasame') && en && (en.d.weak || []).includes('water') && m.mp >= 6) return { type: 'skill', skill: 'murasame' };
  if (sk.includes('enbu') && en && (en.d.weak || []).includes('fire') && m.mp >= 7) return { type: 'skill', skill: 'enbu', target: en };
  if (sk.includes('katon') && liveEn().length > 1 && !liveEn().every(e => (e.d.resist || []).includes('fire')) && m.mp >= 5) return { type: 'skill', skill: 'katon' };
  if (sk.includes('enbu') && en && B.boss && !(en.d.resist || []).includes('fire') && m.mp >= 7 + 8) return { type: 'skill', skill: 'enbu', target: en };
  if (sk.includes('chunoinori') && liveP().some(x => x.hp < stat(x, 'hp') * 0.6) && m.mp >= 8) return { type: 'skill', skill: 'chunoinori' };
  if (sk.includes('hayate') && B.boss && m.mp >= 4 + 3) return { type: 'skill', skill: 'hayate', target: en };
  if (sk.includes('ginoichigeki') && B.boss && m.mp >= 5 + 2) return { type: 'skill', skill: 'ginoichigeki', target: en };
  return { type: 'attack', target: en };
}

window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
